name: 三平台打包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 奶龙投稿助手-windows
          - os: macos-latest
            artifact: 奶龙投稿助手-macos
          - os: ubuntu-latest
            artifact: 奶龙投稿助手-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Qt 运行依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt pyinstaller
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install pillow
          fi
        shell: bash

      - name: 校验版本与发版公告
        run: python scripts/validate_release.py

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean 奶龙投稿助手.spec

      - name: 整理产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/奶龙投稿助手.exe" -DestinationPath "奶龙投稿助手-windows.zip"

      - name: 制作 DMG 安装包（macOS）
        if: runner.os == 'macOS'
        run: bash scripts/make_dmg.sh

      - name: 制作 DEB 安装包（Linux）
        if: runner.os == 'Linux'
        run: bash scripts/make_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            奶龙投稿助手-*.zip
            奶龙投稿助手-*.dmg
            奶龙投稿助手-*.deb

      - name: 发布 Release（打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            奶龙投稿助手-*.zip
            奶龙投稿助手-*.dmg
            奶龙投稿助手-*.deb

  version-json:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成待部署 version.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json, os
          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          path = "server/version.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = ver
          data["github_url"] = (
              f"https://github.com/{repo}/releases/download/{tag}/"
              "奶龙投稿助手-windows.zip"
          )
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open(path, encoding="utf-8").read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: server/version.json
