name: 三平台打包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 奶龙投稿助手-windows
          - os: macos-latest
            artifact: 奶龙投稿助手-macos
          - os: ubuntu-latest
            artifact: 奶龙投稿助手-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Qt 运行依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean 奶龙投稿助手.spec

      - name: 整理产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/奶龙投稿助手.exe" -DestinationPath "奶龙投稿助手-windows.zip"

      - name: 整理产物（macOS）
        if: runner.os == 'macOS'
        run: cd dist && zip -r -y "../奶龙投稿助手-macos.zip" "奶龙投稿助手.app"

      - name: 整理产物（Linux）
        if: runner.os == 'Linux'
        run: tar -czf "奶龙投稿助手-linux.tar.gz" -C dist "奶龙投稿助手"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            奶龙投稿助手-*.zip
            奶龙投稿助手-*.tar.gz

      - name: 发布 Release（打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            奶龙投稿助手-*.zip
            奶龙投稿助手-*.tar.gz
